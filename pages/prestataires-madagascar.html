    <style>
        .region-detail { background: var(--blanc); padding: 40px; margin: 40px 0; border: 1px solid #e8e8e8; }

        .region-header h3 { color: var(--noir); font-size: 1.5em; font-weight: normal; letter-spacing: 1px; margin: 0; }
        .region-badge { color: var(--dore); font-size: 0.8em; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--dore); padding: 5px 15px; }

        .presta-section { margin: 30px 0; }
        .presta-section h4 { color: var(--noir); font-size: 0.9em; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid #e8e8e8; }
        .presta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
        .presta-card { padding: 12px 15px; border-left: 2px solid var(--dore); font-size: 0.9em; background: #fafaf8; }
        .presta-card strong { color: var(--noir); }
        .presta-card .contact { color: var(--dore); font-size: 0.85em; }
        .presta-card .detail { color: var(--gris); font-size: 0.8em; display: block; margin-top: 3px; }
        .province-separator { text-align: center; margin: 70px 0 30px; font-size: 1.4em; color: var(--dore); letter-spacing: 3px; text-transform: uppercase; padding-bottom: 20px; border-bottom: 1px solid #e8e8e8; }
        .filter-bar { background: var(--blanc); padding: 20px; margin-bottom: 40px; border: 1px solid #e8e8e8; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .filter-bar select, .filter-bar input { padding: 10px 15px; border: 1px solid #ddd; font-size: 0.9em; font-family: inherit; background: #fafaf8; }
        .filter-bar input { flex: 1; min-width: 200px; }
        .btn-wa { display: inline-block; margin-top: 5px; padding: 4px 10px; background: var(--dore); color: var(--noir); text-decoration: none; font-size: 0.75em; letter-spacing: 1px; text-transform: uppercase; font-weight: bold; }

        function renderRegions(regions) {
            const container = document.getElementById('regionsContainer');

            provinces.forEach(province => {
                const provRegions = regions.filter(r => r.province === province);
                container.innerHTML += '<div class="province-separator">Province de ' + province + '</div>';

                provRegions.forEach(r => {
                    let html = '<div class="region-detail" data-province="'+r.province+'">';
                    html += '<div class="region-header"><h3>'+r.nom+'</h3><span class="region-badge">'+r.province+'</span></div>';
                    html += '<div class="region-stats"><span>Chef-lieu : <strong>'+r.chefLieu+'</strong></span><span>Population : '+r.pop+'</span><span>Superficie : '+r.sup+'</span></div>';
                    html += '<p class="region-desc">'+r.desc+'</p>';

                    if(r.espaces) { html += '<div class="presta-section"><h4>Espaces evenementiels ('+r.espaces.length+')</h4><div class="presta-grid">'; r.espaces.forEach(e => { html += '<div class="presta-card"><strong>'+e.n+'</strong> <span class="contact">'+e.c+'</span><span class="detail">'+e.cap+' — '+e.d+'</span><a href="https://wa.me/'+e.c.replace(/[^0-9]/g,'')+'" class="btn-wa">WhatsApp</a></div>'; }); html += '</div></div>'; }
                    if(r.hebergements) { html += '<div class="presta-section"><h4>Hebergements ('+r.hebergements.length+')</h4><div class="presta-grid">'; r.hebergements.forEach(h => { html += '<div class="presta-card"><strong>'+h.n+'</strong> <span class="contact">'+h.c+'</span><span class="detail">'+h.t+' — '+h.d+'</span><a href="https://wa.me/'+h.c.replace(/[^0-9]/g,'')+'" class="btn-wa">WhatsApp</a></div>'; }); html += '</div></div>'; }

        function filterRegions() {
            const province = document.getElementById('filterProvince').value;
            const search = document.getElementById('filterSearch').value.toLowerCase();
            let filtered = data;
            if(province !== 'all') filtered = filtered.filter(r => r.province === province);
            if(search) filtered = filtered.filter(r => JSON.stringify(r).toLowerCase().includes(search));
            renderRegions(filtered);
        }

        renderRegions(data);
